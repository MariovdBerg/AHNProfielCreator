; Instellingen van het demotraject: Lekdijk bij Schalkwijk (traject 44-1), zie README.md.
; Geen buitenlijn meegeleverd: die wordt 20 m links van de tekenrichting afgeleid (de Lek ligt links).
; De meegeleverde AHN5-strook staat in invoer\AHN\AHN5\DTM05 (ahn_file_loc = AHN).
; Instellingen van een project voor ahn-profielen en de webapp. Alle instellingen staan erin, ook de
; standaardwaarden, zodat zichtbaar is wat gebruikt wordt. De projectmap is de map van dit bestand.
; Gebruik: open het project in de webapp, of: ahn-profielen --config <dit bestand>
; Paden zonder aanhalingstekens. Een lege waarde betekent de standaardwaarde.

[profielen]

; ---- Invoer (relatieve paden gelden t.o.v. de map invoer van het project) ----
; Shapefile met de dijkvakken (lijnen in RD New), één feature per vak
input_line = demo_dijkvakken.shp
; Attribuut in de dijkvakken (en eventueel de buitenlijn) met de naam van het vak
group_id = vak_id
; Shapefile met de buitenlijn (bepaalt welke kant buiten ligt); leeg = geen of afleiden
input_line_outside =
; [m] zonder buitenlijn: leid die af door de dijkvakken zoveel te verschuiven (kleiner dan de halve cross_length); 0 = niet afleiden
outside_offset = 20.0
; Kant van de afgeleide buitenlijn t.o.v. de tekenrichting: links of rechts
outside_side = links

; ---- AHN ----
; AHN-map met een map per versie en product met de tiffs, bijv. D:\AHN met D:\AHN\AHN5\DTM05; versiemappen AHN1 - AHN6, productmappen DSM05, DSM5, DTM05, DTM5
ahn_file_loc = AHN
; Map voor gedownloade kaartbladen (~200 MB per blad bij 0,5 m), ook hier wordt gezocht; ..\..\ahn_data = ahn_data in de werkmap, gedeeld door alle projecten
ahn_file_downloaded = ..\..\ahn_data
; Kaartbladen met downloadlinks (.gpkg/.shp); leeg = de meegeleverde bladwijzer.gpkg
ahn_index =
; Attribuut in de kaartbladen met de bladnaam
ahn_index_id = AHN
; AHN-versie (1 - 5); bladen zonder deze versie vallen terug op AHN4
ahn_versie = 5
; DTM (maaiveld) of DSM (oppervlakte)
model = DTM
; [m] resolutie van het AHN-model: 0.5 of 5
model_resolutie = 0.5

; ---- Dwarslijnen ----
; [m] afstand tussen de profielen langs elk vak
interval_length = 10.0
; [m] lengte van een dwarslijn, de helft aan elke kant van de dijklijn; 200 = 100 m buiten, past bij HR-locaties op ~100 m van de kruin
cross_length = 200.0
; [m] afstand tussen de hoogtepunten langs een dwarslijn
ahn_stepsize = 0.5

; ---- Schematisatie tot één Hydra-NL profiel (.prfl) per vak, optioneel na de berekening; nodig: buitenlijn en prflcheck ----
; [-] kwantiel van de hoogtes van de profielen in een vak (lager = voorzichtiger, lager profiel)
schem_kwantiel = 0.2
; [m] zoek de kruin (hoogste punt) binnen deze afstand van de dijklijn
schem_kruin_zoekafstand = 10.0
; [-] ruwheid van het talud in het .prfl, 0.5 - 1.0 (1.0 = gras)
schem_ruwheid = 1.0
; Voorland (buiten de teen) in het .prfl: ja of nee
schem_voorland = ja
; [m] een berm telt mee als die minstens zo breed is
schem_min_bermbreedte = 3.0
; [m] en de taluds onder en boven de berm minstens zo hoog zijn (anders is het voorland of de kruin)
schem_min_taludhoogte = 0.5
; [-] en de afwijking (RMSE) van het profiel door de berm minstens deze fractie daalt (0.2 = 20%)
schem_berm_winst_rel = 0.2
; [m] en ook minstens zoveel daalt
schem_berm_winst_abs = 0.03
; [m] minimale breedte van een talud
schem_min_taludbreedte = 2.0
; [m] raster van de knikpunten en van het representatieve profiel
schem_stap = 0.5
; [m] in de fit telt het voorland alleen tot zover (plus de dijkbreedte) buiten de teen
schem_voorland_fit = 30.0
; Delen voorland in de fit, 1 - 3; meer delen kan een berm aan de teen als voorland zien
schem_voorland_delen = 1
; Decimalen van x en z in het .prfl, 1 - 6; minder decimalen geeft een grotere marge op de hellingsgrenzen
schem_decimalen = 3

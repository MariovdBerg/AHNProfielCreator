[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ahnprofielcreator"
version = "0.1.0"
description = "Genereer AHN profielen (dwarslijnen met hoogtes) langs een traject, per dijkvak"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "fiona",
    "numpy",
    "rasterio",
    "shapely>=2",
    "tqdm",
]

[project.optional-dependencies]
# Schematiseren tot .prfl (ProfielCheckPython, niet op PyPI)
schem = ["prflcheck @ https://github.com/MariovdBerg/ProfielCheckPython/archive/refs/heads/main.zip"]
test = ["pytest"]

[project.scripts]
ahn-profielen = "ahnprofielcreator.profielen_per_vak:main"
ahn-profielen-app = "ahnprofielcreator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ahnprofielcreator" = ["data/*.gpkg", "data/demo/*"]
"ahnprofielcreator.app" = ["static/*", "static/vendor/leaflet/*", "static/vendor/leaflet/images/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = ["-m", "not ahn"]
markers = ["ahn: heeft lokale AHN5-tiffs nodig (AHN_TEST_DIR); draaien met: pytest -m ahn"]

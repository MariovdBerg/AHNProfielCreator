# Conda-omgeving voor AHNProfielCreator: conda env create -f environment.yml
name: ahnprofielcreator
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - certifi
  - fiona
  - numpy
  - rasterio
  - shapely>=2
  - tqdm
  - pytest
  - pip
  - pip:
      # Schematiseren tot .prfl (ProfielCheckPython, niet op PyPI); optioneel
      - https://github.com/MariovdBerg/ProfielCheckPython/archive/refs/heads/main.zip

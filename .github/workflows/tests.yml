# Draait de snelle tests (pytest, zonder -m ahn) in de conda-omgeving uit environment.yml.
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Windows, zoals de gebruikers: paden in de configuratie (bijv. ..\..\ahn_data) gebruiken backslashes.
    runs-on: windows-latest
    defaults:
      run:
        # Login-shell, zodat de conda-omgeving geactiveerd is (nodig voor de DLL's van GDAL en PROJ).
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: ahnprofielcreator

      - name: Pakket installeren
        run: python -m pip install -e .

      - name: Tests
        run: pytest

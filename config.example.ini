; Instellingen voor ahn-profielen en de webapp (overgenomen uit profielen_per_vak.ipynb).
; Kopieer naar config.ini en pas de paden aan.
; Gebruik: start_app.bat, of: ahn-profielen --config config.ini
; Paden zonder aanhalingstekens. Laat een waarde leeg voor de standaardwaarde.

[profielen]
; Werkmap voor opslaan; output komt in <cur_dir>\output_per_vak_<interval_length>m
; Niet test\test_output: daar staat de referentie-uitvoer voor de tests.
cur_dir = output

; Nodige shape informatie (hier het meegeleverde demotraject)
input_line = src\ahnprofielcreator\data\demo\demo_dijkvakken.shp
input_line_outside = src\ahnprofielcreator\data\demo\demo_buitenlijn.shp
; Geen buitenlijn? Laat input_line_outside leeg en leid die af uit de dijkvakken: verschuif ze zoveel meter
; (kleiner dan de halve cross_length) naar links of rechts van de tekenrichting. Leeg of 0 = niet afleiden.
outside_offset =
; links of rechts (leeg = links)
outside_side =
; Attribuut in shape om te groeperen
group_id = vak_id

; Nodige AHN informatie
; Map met lokale AHN tiffs (binnen HKV bijv. P:\OpenData\AHN\AHN5\DTM05 of P:\OpenData\AHN\AHN4\DTM05)
; Hier de map met de AHN5-strook van het demotraject, zodat het voorbeeld zonder download werkt.
ahn_file_loc = src\ahnprofielcreator\data\demo
; Map voor ontbrekende kaartbladen die gedownload worden (~200 MB per blad bij 0,5 m); leeg = ahn_file_loc.
; Gebruik dit als ahn_file_loc alleen-lezen is of er geen downloads in moeten komen. Ook hier wordt gezocht.
ahn_file_downloaded = ahn_data
; Kaartbladen met downloadlinks; leeg = de meegeleverde bladwijzer.gpkg, met bladnaam in attribuut AHN
ahn_index =
ahn_index_id =
; AHN-versie (leeg = 5); bladen zonder deze versie vallen terug op AHN4
ahn_versie =
; DTM (maaiveld) of DSM (oppervlakte); leeg = DTM
model =
; [m] resolutie van het AHN-model: 0.5 of 5; leeg = 0.5
model_resolutie =

; Instellingen
; [m] afstand tussen profielen langs het traject
interval_length = 10
; [m] lengte dwarsdoorsnede (helft naar beide kanten); 200 = 100 m buiten, past bij HR-locaties op ~100 m van de kruin
cross_length = 200.0
; [m] stapgrootte voor AHN hoogte
ahn_stepsize = 0.5

; Schematisatie tot één Hydra-NL profiel (.prfl) per vak: optionele stap na de berekening
; (knop Schematiseren in de webapp, of: ahn-profielen --schematiseren). Nodig: buitenlijn en prflcheck.
; [-] kwantiel van de hoogtes van de profielen in een vak (leeg = 0.2; lager = voorzichtiger, lager profiel)
schem_kwantiel =
; [m] zoek de kruin (hoogste punt) binnen deze afstand van de dijklijn (leeg = 10)
schem_kruin_zoekafstand =
; [-] ruwheid van het talud in het .prfl, 0.5 - 1.0 (leeg = 1.0, gras)
schem_ruwheid =
; Voorland (buiten de teen) in het .prfl: ja of nee (leeg = ja)
schem_voorland =
; Wanneer telt een berm mee (leeg = standaard):
; [m] minimale breedte van een berm (3)
schem_min_bermbreedte =
; [m] de taluds onder en boven een berm zijn minstens zo hoog (0.5); anders is het voorland of de kruin
schem_min_taludhoogte =
; De afwijking (RMSE) van het profiel moet door de berm minstens deze fractie dalen (0.2 = 20%)...
schem_berm_winst_rel =
; ... en ook minstens zoveel meter (0.03)
schem_berm_winst_abs =
; Overige instellingen van de fit (leeg = standaard). De grenzen voor de hellingen, het aantal bermen, de
; afstand tussen voorlandpunten en de ruwheid komen uit prflcheck (ProfielCheckPython).
; [m] minimale breedte van een talud (2)
schem_min_taludbreedte =
; [m] raster van de knikpunten en van het representatieve profiel (0.5)
schem_stap =
; [m] in de fit telt het voorland alleen tot zover (plus de dijkbreedte) buiten de teen (30)
schem_voorland_fit =
; Delen voorland in de fit, 1 - 3 (1); meer delen kan een berm aan de teen als voorland zien
schem_voorland_delen =
; Decimalen van x en z in het .prfl, 1 - 6 (3); minder decimalen geeft een grotere marge op de hellingsgrenzen
schem_decimalen =

; Instellingen voor ahn-profielen en de webapp (overgenomen uit profielen_per_vak.ipynb).
; Kopieer naar config.ini en pas de paden aan.
; Gebruik: start_app.bat, of: ahn-profielen --config config.ini
; Paden zonder aanhalingstekens. Laat een waarde leeg voor de standaardwaarde.

[profielen]
; Werkmap voor opslaan; output komt in <cur_dir>\output_per_vak_<interval_length>m
cur_dir = test\test_output

; Nodige shape informatie
input_line = test\test_input\WAD_GEKB_basisanalyse_profielen_v2.shp
input_line_outside = test\test_input\WAD_GEKB_basisanalyse_profielen_v2_outsideline.shp
; Geen buitenlijn? Laat input_line_outside leeg en leid die af uit de dijkvakken: verschuif ze zoveel meter
; (kleiner dan de halve cross_length) naar links of rechts van de tekenrichting. Leeg of 0 = niet afleiden.
outside_offset =
; links of rechts (leeg = links)
outside_side =
; Attribuut in shape om te groeperen
group_id = vak_id

; Nodige AHN informatie
; Map met lokale AHN tiffs (binnen HKV bijv. P:\OpenData\AHN\AHN5\DTM05 of P:\OpenData\AHN\AHN4\DTM05)
ahn_file_loc = ahn_data
; Map voor ontbrekende kaartbladen die gedownload worden (~200 MB per blad bij 0,5 m); leeg = ahn_file_loc.
; Gebruik dit als ahn_file_loc alleen-lezen is of er geen downloads in moeten komen. Ook hier wordt gezocht.
ahn_file_downloaded =
; Kaartbladen met downloadlinks; leeg = de meegeleverde bladwijzer.gpkg, met bladnaam in attribuut AHN
ahn_index =
ahn_index_id =
; AHN-versie (leeg = 5); bladen zonder deze versie vallen terug op AHN4
ahn_versie =
; DTM (maaiveld) of DSM (oppervlakte); leeg = DTM
model =
; [m] resolutie van het AHN-model: 0.5 of 5; leeg = 0.5
model_resolutie =

; Instellingen
; [m] afstand tussen profielen langs het traject
interval_length = 10
; [m] lengte dwarsdoorsnede (helft naar beide kanten)
cross_length = 100.0
; [m] stapgrootte voor AHN hoogte
ahn_stepsize = 0.5
